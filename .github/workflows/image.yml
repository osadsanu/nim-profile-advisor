name: Container image

# Builds nim_advisor/Dockerfile (build context: repository root), tests the image and publishes it to
# ghcr.io/<owner>/<repo>: latest (default branch), sha-<commit>, and <version> / <major>.<minor> for v* tags.
# Pull requests build and test the image without publishing it.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build, test and publish the image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: nim_advisor/Dockerfile
          load: true
          tags: nim-advisor:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Unit tests and finder tools inside the image
        run: |
          docker run --rm -v "$PWD/nim_advisor/tests:/srv/tests:ro" --entrypoint sh nim-advisor:ci -ec '
            for t in bash skopeo jq curl file zstd; do command -v "$t" >/dev/null || { echo "missing tool: $t"; exit 1; }; done
            test -s /data/nim_catalog.json && test -s /data/reference/gpu_reference.json && test -d /data/nims_catalog
            bash -n "$FINDER_SCRIPT"
            python -m unittest discover -s tests'

      - name: Start-up import of the bundled catalog and API smoke test
        run: |
          # mongo:7.0 - MongoDB 8.x does not start on the runner kernel (see ci.yml)
          docker network create ci
          docker run -d --name mongo --network ci mongo:7.0
          docker run -d --name web --network ci -p 127.0.0.1:8000:8000 \
            -e MONGO_URI=mongodb://mongo:27017 -e SEED_IMPORT=if-changed nim-advisor:ci
          python3 nim_advisor/tools/smoke_test.py http://127.0.0.1:8000 || { docker logs web; exit 1; }

      - name: Image tags
        id: meta
        if: github.event_name != 'pull_request'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: nim_advisor/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
