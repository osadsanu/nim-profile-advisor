name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and import smoke test
    runs-on: ubuntu-24.04
    services:
      mongo:
        # MongoDB 8.x refuses to start on the runner kernel (7.0.x-azure: TCMalloc / rseq incompatibility,
        # SERVER-121912 and SERVER-136848). 7.0 uses the previous allocator; the app needs no 8.x feature.
        # docker compose and the Helm chart keep mongo:8.0.
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      MONGO_URI: mongodb://localhost:27017
      MONGO_DB: nim_advisor
      DATA_DIR: ${{ github.workspace }}
    defaults:
      run:
        working-directory: nim_advisor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: nim_advisor/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check the shell scripts
        run: for f in ../nim_profile_finder_v2.sh ../bulk_fetch_profiles.sh ../scripts/*.sh; do bash -n "$f"; done

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Import nim_catalog.json + nims_catalog/ + reference/ into MongoDB
        run: python -m app.importer

      - name: API smoke test
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          python tools/smoke_test.py http://127.0.0.1:8000 || { cat uvicorn.log; exit 1; }