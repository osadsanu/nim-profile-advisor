# NIM Profile Advisor for HPE Private Cloud AI
#
#   docker compose up -d --build        # MongoDB + import + website (http://localhost:8080)
#   docker compose run --rm importer    # re-import after refreshing nims_catalog/ (run tools/validate_gpu_ids.py first)
#   docker compose run --rm db-export   # export the database into ./db_export
#   docker compose run --rm db-restore  # load ./db_export into MongoDB (instead of importing)
#   docker compose --profile admin up -d mongo-express   # optional DB browser (http://localhost:8081)
#
# Credentials come from .env (see .env.example). Set NIM_ADVISOR_IMAGE in .env to run the published image
# instead of building it. All ports are bound to localhost only. See README.md.

name: nim-advisor

x-app: &app
  image: ${NIM_ADVISOR_IMAGE:-nim-advisor:local}
  build:
    context: ./nim_advisor
  environment:
    MONGO_URI: mongodb://${MONGO_ROOT_USER:-nimadmin}:${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}@mongo:27017/?authSource=admin
    MONGO_DB: ${MONGO_DB:-nim_advisor}
    DATA_DIR: /data
    INTERNAL_REGISTRY_PREFIX: ${INTERNAL_REGISTRY_PREFIX:-registry.example.com/ezmeral-common/}

x-db-tools: &db-tools
  image: mongo:8.0
  profiles: ["tools"]
  restart: "no"
  environment:
    MONGO_URI: mongodb://${MONGO_ROOT_USER:-nimadmin}:${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}@mongo:27017/?authSource=admin
    MONGO_DB: ${MONGO_DB:-nim_advisor}
    RESTORE_DB: ${RESTORE_DB:-}
  depends_on:
    mongo:
      condition: service_healthy

services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-nimadmin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  importer:
    <<: *app
    command: ["python", "-m", "app.importer"]
    restart: "no"
    volumes:
      - ./nim_catalog.json:/data/nim_catalog.json:ro
      - ./nims_catalog:/data/nims_catalog:ro
      - ./reference:/data/reference:ro
    depends_on:
      mongo:
        condition: service_healthy

  web:
    <<: *app
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8000"
    volumes:
      - ./reference:/data/reference:ro
    depends_on:
      mongo:
        condition: service_healthy
      importer:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6

  mongo-express:
    image: mongo-express:1.0.2
    profiles: ["admin"]
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ROOT_USER:-nimadmin}:${MONGO_ROOT_PASSWORD}@mongo:27017/?authSource=admin
      ME_CONFIG_BASICAUTH: "true"
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_ROOT_USER:-nimadmin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MONGO_EXPRESS_PORT:-8081}:8081"
    depends_on:
      mongo:
        condition: service_healthy

  db-export:
    <<: *db-tools
    entrypoint: ["bash", "/scripts/db_export.sh"]
    volumes:
      - ./scripts:/scripts:ro
      - ./db_export:/export

  db-restore:
    <<: *db-tools
    entrypoint: ["bash", "/scripts/db_restore.sh"]
    volumes:
      - ./scripts:/scripts:ro
      - ./db_export:/export:ro

volumes:
  mongo-data:
