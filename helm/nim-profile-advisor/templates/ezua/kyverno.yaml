{{- if and .Values.pcai.enabled .Values.pcai.kyverno }}
# Adds the hpe-ezua labels to the pods of this release at admission time (framework guide).
# The match is limited to this release: the PCAI documentation warns that a policy for every pod of a project
# namespace can break platform pods and jobs (chown-project-pvc, ml-pipeline-ui-artifact).
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: {{ printf "add-vendor-app-labels-%s-%s" .Release.Name .Chart.Name | trunc 63 | trimSuffix "-" }}
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  background: false
  rules:
    - name: add-vendor-app-labels
      match:
        any:
          - resources:
              namespaces:
                - {{ .Release.Namespace }}
              kinds:
                - Pod
              selector:
                matchLabels:
                  app.kubernetes.io/name: {{ include "nim-profile-advisor.name" . }}
                  app.kubernetes.io/instance: {{ .Release.Name }}
      mutate:
        patchStrategicMerge:
          metadata:
            labels:
              {{- include "hpe-ezua.labels" . | nindent 14 }}
{{- end }}
