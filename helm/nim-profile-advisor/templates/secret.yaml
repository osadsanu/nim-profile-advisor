apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nim-profile-advisor.secretName" . }}
  labels:
    {{- include "nim-profile-advisor.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.env }}
  {{ $key }}: {{ toString $value | quote }}
  {{- end }}
  MONGO_URI: {{ include "nim-profile-advisor.mongoUri" . | quote }}
